<script>
(function initFunnel() {
  const form = document.getElementById("triadFlowForm");
  if (!form) return;

  const steps = Array.from(form.querySelectorAll(".form-step"));
  const nextBtns = form.querySelectorAll(".next-btn");
  const submitBtn = document.getElementById("submitLeadBtn");
  const container = document.querySelector(".funnel-container");

  const zipInput = document.getElementById("Zip");
  const zipFeedback = document.getElementById("zipFeedback");
  const zipVerified = document.getElementById("zipVerified");
  const zipContinueBtn = document.getElementById("zipContinueBtn");

  const STEP_EVENT_MAP = {
    "step-0": "Step_1_Zip",
    "step-1": "Step_2_Age",
    "step-2": "Step_3_Marital",
    "step-3": "Step_4_Goal",
    "step-4": "Step_5_Advisor",
    "step-5": "Step_6_Assets",
    "step-6": "Step_7_Contact"
  };

  const SESSION_KEY = "triadflow_step_events_seen";
  const inMemorySeen = new Set();

  function safeFbq(method, eventName, params) {
    try {
      if (typeof window.fbq === "function") {
        window.fbq(method, eventName, params || {});
      }
    } catch (_) {}
  }

  function trackStandard(eventName, params) {
    safeFbq("track", eventName, params);
  }

  function trackCustom(eventName, params) {
    safeFbq("trackCustom", eventName, params);
  }

  function getSeenEvents() {
    try {
      const raw = sessionStorage.getItem(SESSION_KEY);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch (_) {
      return new Set(inMemorySeen);
    }
  }

  function setSeenEvents(seenSet) {
    try {
      sessionStorage.setItem(SESSION_KEY, JSON.stringify([...seenSet]));
    } catch (_) {
      inMemorySeen.clear();
      for (const item of seenSet) inMemorySeen.add(item);
    }
  }

  function trackOncePerSession(eventName, params) {
    const seen = getSeenEvents();
    if (seen.has(eventName)) return;
    seen.add(eventName);
    setSeenEvents(seen);
    trackCustom(eventName, params);
  }

  function getTriadCity(zip) {
    const z = Number(zip);
    if (z >= 27401 && z <= 27455) return "Greensboro";
    if (z >= 27101 && z <= 27127) return "Winston-Salem";
    if (z >= 27260 && z <= 27265) return "High Point";
    return null;
  }

  function normalizeZipValue() {
    if (!zipInput) return "";
    zipInput.value = zipInput.value.replace(/\D/g, "").slice(0, 5);
    return zipInput.value;
  }

  function validateZip(showMessages) {
    if (!zipInput) return { ok: true, city: "" };

    const zip = normalizeZipValue();
    const isFiveDigits = /^[0-9]{5}$/.test(zip);

    if (!isFiveDigits) {
      zipInput.setCustomValidity("Please enter a valid 5-digit ZIP code.");
      if (showMessages) {
        if (zipFeedback) zipFeedback.textContent = "Please enter a valid 5-digit ZIP code.";
        if (zipVerified) zipVerified.style.display = "none";
      }
      return { ok: false, city: "" };
    }

    const city = getTriadCity(zip);
    if (!city) {
      zipInput.setCustomValidity("Please enter a ZIP code in Greensboro, Winston-Salem, or High Point.");
      if (showMessages) {
        if (zipFeedback) zipFeedback.textContent = "ZIP not in service area. Use Greensboro, Winston-Salem, or High Point ZIP.";
        if (zipVerified) zipVerified.style.display = "none";
      }
      return { ok: false, city: "" };
    }

    zipInput.setCustomValidity("");
    if (showMessages) {
      if (zipFeedback) zipFeedback.textContent = city + ", NC confirmed.";
      if (zipVerified) zipVerified.style.display = "block";
    }

    return { ok: true, city };
  }

  function syncZipButtonState() {
    if (!zipInput || !zipContinueBtn) return;
    const zip = normalizeZipValue();
    zipContinueBtn.disabled = !/^[0-9]{5}$/.test(zip);

    if (zip.length < 5) {
      if (zipFeedback) zipFeedback.textContent = "";
      if (zipVerified) zipVerified.style.display = "none";
      zipInput.setCustomValidity("Please enter a valid 5-digit ZIP code.");
    }
  }

  if (zipInput) {
    zipInput.setAttribute("inputmode", "numeric");
    zipInput.setAttribute("maxlength", "5");
    zipInput.setAttribute("pattern", "[0-9]{5}");
    zipInput.setAttribute("title", "Please enter a 5-digit ZIP code.");
    zipInput.addEventListener("input", syncZipButtonState);
    zipInput.addEventListener("blur", function () { validateZip(true); });
    syncZipButtonState();
  }

  nextBtns.forEach((btn) => {
    btn.addEventListener("click", function () {
      const currentStep = btn.closest(".form-step");
      if (!currentStep) return;

      const currentIndex = steps.indexOf(currentStep);
      if (currentIndex < 0 || currentIndex >= steps.length - 1) return;

      if (currentStep.id === "step-0") {
        const zipResult = validateZip(true);
        if (!zipResult.ok) {
          zipInput.reportValidity();
          zipInput.focus();
          return;
        }

        const step1Title = document.getElementById("step-1-title");
        if (step1Title) {
          step1Title.textContent = "Personalized Analysis for " + zipResult.city + " Households.";
        }
      }

      const fields = currentStep.querySelectorAll("input, select, textarea");
      for (const field of fields) {
        if (!field.checkValidity()) {
          field.reportValidity();
          field.focus();
          return;
        }
      }

      const fromStepId = currentStep.id;
      const toStep = steps[currentIndex + 1];

      currentStep.classList.remove("active");
      toStep.classList.add("active");

      const eventName = STEP_EVENT_MAP[fromStepId];
      if (eventName) {
        trackOncePerSession(eventName, { from_step: fromStepId, to_step: toStep.id });
      }
    });
  });

  function renderSuccessScreen() {
    if (!container || document.getElementById("success-state")) return;
    form.style.display = "none";

    const successDiv = document.createElement("div");
    successDiv.id = "success-state";
    successDiv.innerHTML = `
      <h2 style="color:#2b6cb0;font-size:28px;margin-bottom:10px;">Success! Your Roadmap is Ready.</h2>
      <img src="will.webp" alt="William Chappell" style="width:140px;height:140px;border-radius:50%;object-fit:cover;margin:20px auto;display:block;border:4px solid #2b6cb0;box-shadow:0 4px 10px rgba(0,0,0,0.1);">
      <p style="font-size:18px;margin-top:15px;">Based on your answers, your profile has been matched with <strong>Lead Advisor William Chappell</strong>.</p>
      <p style="font-size:18px;font-weight:bold;color:#1a365d;">Please check your email inbox (and spam folder) in the next 60 seconds.</p>
      <p style="font-size:16px;margin-top:15px;color:#4a5568;"><em>Your custom 2026 Financial Transition Roadmap is attached to that email.</em></p>
      <a href="https://calendly.com/wchappell37/retirement-consultation" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin-top:25px;padding:18px 30px;background-color:#d97706;color:white;text-decoration:none;font-size:20px;font-weight:bold;border-radius:6px;box-shadow:0 4px 6px rgba(0,0,0,0.1);transition:background 0.3s;">
        Schedule Your Priority Review Now
      </a>
    `;
    container.appendChild(successDiv);
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    trackOncePerSession("Step_7_Contact", { from_step: "step-6" });

    if (submitBtn) {
      submitBtn.innerText = "Generating Roadmap...";
      submitBtn.disabled = true;
    }

    const controller = new AbortController();
    const timeoutId = setTimeout(function () {
      controller.abort();
    }, 5000);

    try {
      await fetch(form.action, {
        method: "POST",
        mode: "no-cors",
        body: new FormData(form),
        signal: controller.signal
      });

      trackStandard("Lead");
      renderSuccessScreen();
    } catch (_) {
      if (submitBtn) {
        submitBtn.innerText = "Error - Please try again";
        submitBtn.disabled = false;
      }
      alert("Secure connection timeout. Please call our office directly to receive your roadmap.");
    } finally {
      clearTimeout(timeoutId);
    }
  });

  trackStandard("ViewContent");

  window.addEventListener("message", function (e) {
    if (e.origin !== "https://calendly.com") return;
    if (e.data && e.data.event === "calendly.event_scheduled") {
      trackStandard("Schedule");
    }
  });
})();
</script>
